name: Build Android Geode Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build unzip wget

    - name: Download Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r25c" >> $GITHUB_ENV

    - name: Download Geode SDK
      run: |
        wget -O geode-sdk.zip https://github.com/Geode-sdk/Geode/archive/refs/heads/main.zip
        unzip geode-sdk.zip
        echo "GEODE_SDK=$PWD/Geode-main" >> $GITHUB_ENV

    - name: Build Android .so
      run: |
        mkdir build
        cd build
        cmake \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DGEODE_TARGET_PLATFORM=Android \
          -DANDROID_PLATFORM=android-24 \
          -G Ninja \
          ..
        cmake --build . --config Release

    - name: Package .geode
      run: |
        mkdir fps-counter.geode
        cp build/lukas.fps_counter.android64.so fps-counter.geode/
        cp mod.json fps-counter.geode/
        cp -r resources fps-counter.geode/
        zip -r fps-counter.geode.zip fps-counter.geode

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fps-counter.geode
        path: fps-counter.geode.zip
